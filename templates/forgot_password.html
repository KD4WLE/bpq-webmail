{% extends "base.html" %}
{% block content %}

<div class="card">
  <h1>Forgot Password</h1>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  {% if message %}
    <div class="cache-notice">{{ message }}</div>
  {% endif %}

  <form method="post" action="/forgot-password">
    <label>Website Username</label>
    <input type="text" name="username" autocomplete="username" required>

    <label>Callsign</label>
    <input type="text" name="callsign" required>

    <label>Message</label>
    <textarea name="message" placeholder="Optional note for the sysop"></textarea>

    <button type="submit">Request Password Reset</button>
    <a class="button" href="/login">Back to Login</a>
  </form>
</div>

{% endblock %}
