{% extends "base.html" %}
{% block content %}
<div class="card">
  <p><a href="/inbox">← Back to inbox</a></p>
  <h1>{{ message.subject }}</h1>
  <p><strong>From:</strong> {{ message.from }}</p>
  <p><strong>To:</strong> {{ message.to }}</p>
  <p><strong>Date:</strong> {{ message.date }}</p>
  <div>
    <a class="button" href="/compose?mode=private&to={{ message.from | urlencode }}&subject=Re:%20{{ message.subject | urlencode }}">Reply</a>
    <form method="post" action="/message/{{ message_id }}/kill" style="display:inline;" onsubmit="return confirm('Kill this message?');">
      <button type="submit">Kill</button>
    </form>
  </div>
</div>
<div class="card">
  <pre>{{ message.body }}</pre>
</div>
{% endblock %}
