{% extends "base.html" %}
{% block content %}
<div class="card">
  <p><a href="/inbox">← Back to inbox</a></p>
  <h1>{{ message.subject }}</h1>
  <p><strong>From:</strong> {{ message.from }}</p>
  <p><strong>To:</strong> {{ message.to }}</p>
  <p><strong>Date:</strong> {{ message.date }}</p>
  <p><a class="button" href="/compose?to={{ message.from | urlencode }}&subject=Re:%20{{ message.subject | urlencode }}">Reply</a></p>
</div>
<div class="card">
  <pre>{{ message.body }}</pre>
</div>
{% endblock %}
