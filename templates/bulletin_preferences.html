{% extends "base.html" %}
{% block content %}

<h2>Bulletin Preferences</h2>

<form method="post" action="/bulletins/preferences" class="card">
  <label>Page size</label>
  <input type="number" name="page_size" value="{{ page_size }}" min="5" max="100">

  <h3>Hide Categories</h3>
  <div class="category-pills">
    {% for c in categories %}
      <label class="pill">
        <input type="checkbox" name="hidden_categories" value="{{ c }}" {% if c in hidden_categories %}checked{% endif %}>
        {{ c }}
      </label>
    {% endfor %}
  </div>

  <h3>Hide Areas</h3>
  <div class="category-pills">
    {% for a in areas %}
      <label class="pill">
        <input type="checkbox" name="hidden_areas" value="{{ a }}" {% if a in hidden_areas %}checked{% endif %}>
        {{ a }}
      </label>
    {% endfor %}
  </div>

  <h3>Hide From</h3>
  <input type="text" name="hidden_senders_text" value="{{ hidden_senders|join(',') }}" placeholder="CALL1,CALL2,CALL3">

  <p>
    <button type="submit">Save Preferences</button>
    <a class="button" href="/bulletins">Cancel</a>
  </p>
</form>

{% endblock %}
